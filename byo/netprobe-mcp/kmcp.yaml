name: netprobe-mcp
framework: fastmcp-python
version: 0.1.0
description: 'Network probes for SRE agents: HTTP check, DNS lookup, TCP connect, TLS certificate expiry'
secrets:
    local:
        enabled: false
        provider: env
        file: .env.local
    production:
        enabled: false
        provider: kubernetes
        secretName: netprobe-mcp-secrets-production
        namespace: kagent
    staging:
        enabled: false
        provider: kubernetes
        secretName: netprobe-mcp-secrets-staging
        namespace: kagent
